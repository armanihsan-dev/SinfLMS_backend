services:
  db:
    image: neondatabase/neon_local:latest
    container_name: backend-db-1
    ports:
      - '5432:5432'
    environment:
      - NEON_API_KEY=${NEON_API_KEY}
      - NEON_PROJECT_ID=${NEON_PROJECT_ID} 
      - NEON_BRANCH_ID=${NEON_BRANCH_ID}
    env_file:
      - .env
    restart: unless-stopped
